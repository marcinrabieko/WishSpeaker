name: WishSpeaker

# OPTIONS

options:
  usesTabs: false
  createIntermediateGroups: true
  useBaseInternationalization: false
  developmentLanguage: en

# ATTRIBUTES

attributes:
  BuildIndependentTargetsInParallel: YES

# CONFIG

configs:
  Debug: debug
  Release: release

# SETTINGS

settings:
  ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: 5.0
  IPHONEOS_DEPLOYMENT_TARGET: 17.0
  DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  DEVELOPMENT_TEAM: AGWMLY37K7
  PRODUCT_BUNDLE_IDENTIFIER: com.wishspeaker.app
  CODE_SIGN_STYLE: Automatic
  TARGETED_DEVICE_FAMILY: "1,2"

# TARGETS

targets:
  MobileApp:
    type: application
    platform: iOS
    productName: WishSpeaker
    sources:
      - path: Targets/MobileApp/Sources
      - path: Targets/MobileApp/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: CorePackage
        product: Domain
      - package: CorePackage
        product: DesignSystem
      - package: CorePackage
        product: StartFeature
      - package: CorePackage
        product: OccasionSelectionFeature
      - package: CorePackage
        product: FormFeature
      - package: CorePackage
        product: WishesFeature
      - package: CorePackage
        product: PackageSelectionFeature
      - package: CorePackage
        product: FinalWishFeature
      - package: CorePackage
        product: LibraryFeature
      - package: CorePackage
        product: ExampleWishesFeature
    settings:
      base:
        PRODUCT_NAME: WishSpeaker
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Targets/MobileApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: WishSpeaker

# FILE GROUPS

fileGroups:
  - README.md
  - CLAUDE.md

# PACKAGES

packages:
  CorePackage:
    path: Packages/CorePackage
